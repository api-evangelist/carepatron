name: Carepatron
kind: company
description: >-
  Carepatron is a cloud-based healthcare practice management and EHR platform
  for therapists, counselors, psychologists, health coaches, nutritionists,
  and other practitioners. It brings client records, appointment scheduling and
  online booking, telehealth, AI-assisted clinical notes and documentation,
  and billing/invoicing with insurance claims into one workspace, and markets
  HIPAA/SOC/GDPR compliance across 100,000+ clinicians in 120+ countries. As of
  this review Carepatron does NOT publish a documented public developer API - its
  pricing page lists "API (coming soon)" on the Advanced plan, and there is no
  developer portal, API reference, published base URL, OpenAPI definition, or
  SDK. Third-party connectivity today is limited to a handful of native
  integrations (Zoom, accounting software, Google Tag Manager). The APIs listed
  below are logical/product-area groupings modeled from Carepatron's own feature
  set; their endpoints are NOT documented and are marked as modeled, not
  confirmed.
